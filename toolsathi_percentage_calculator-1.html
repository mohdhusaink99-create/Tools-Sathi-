<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolSathi - Percentage Calculator</title>
  <meta name="description" content="ToolSathi का आसान और तेज Percentage Calculator।">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; font-size: 30px; }
    header p { margin: 0; opacity: .9; }
    .container {
      max-width: 620px;
      margin: 28px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #eef5ff;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      display: none;
    }
    .info {
      margin-top: 22px;
      line-height: 1.6;
      color: #4b5563;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #667085;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>ToolSathi</h1>
  <p>आपके रोज़मर्रा के आसान Online Tools</p>
</header>

<div class="container">
  <div class="card">
    <h2>Percentage Calculator</h2>
    <p>किसी संख्या का प्रतिशत आसानी से निकालें।</p>

    <label for="percent">प्रतिशत (%)</label>
    <input id="percent" type="number" placeholder="जैसे 20">

    <label for="number">कुल संख्या</label>
    <input id="number" type="number" placeholder="जैसे 500">

    <button onclick="calculate()">Calculate</button>

    <div id="result" class="result"></div>

    <div class="info">
      <strong>उदाहरण:</strong> अगर आपको 500 का 20% निकालना है,
      तो 20 और 500 डालकर Calculate दबाएँ।
    </div>
  </div>
</div>

<footer>
  © 2026 ToolSathi • Free Online Calculator
</footer>

<script>
function calculate() {
  const percent = parseFloat(document.getElementById("percent").value);
  const number = parseFloat(document.getElementById("number").value);
  const result = document.getElementById("result");

  if (isNaN(percent) || isNaN(number)) {
    result.style.display = "block";
    result.textContent = "कृपया दोनों नंबर भरें।";
    return;
  }

  const answer = (percent / 100) * number;
  result.style.display = "block";
  result.textContent = `${number} का ${percent}% = ${answer}`;
}
</script>

</body>
</html>
