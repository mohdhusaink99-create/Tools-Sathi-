<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolSathi - Percentage Calculator</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:25px 15px;
}
header h1{margin:0 0 6px}
.container{
  max-width:600px;
  margin:30px auto;
  padding:0 15px;
}
.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px #0002;
}
input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  background:#2563eb;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}
#result{
  margin-top:20px;
  padding:15px;
  background:#eef5ff;
  border-radius:10px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>ToolSathi</h1>
<p>Easy Online Tools</p>
</header>

<div class="container">
<div class="card">

<h2>Percentage Calculator</h2>
<p>किसी संख्या का प्रतिशत आसानी से निकालें।</p>

<label>प्रतिशत (%)</label>
<input id="percent" type="number" placeholder="जैसे 20">

<label>कुल संख्या</label>
<input id="number" type="number" placeholder="जैसे 500">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

</div>
</div>

<script>
function calculate(){
  let p=parseFloat(document.getElementById("percent").value);
  let n=parseFloat(document.getElementById("number").value);

  if(isNaN(p)||isNaN(n)){
    document.getElementById("result").innerText="दोनों नंबर भरें।";
    return;
  }

  let answer=(p/100)*n;
  document.getElementById("result").innerText=
  n+" का "+p+"% = "+answer;
}
</script>

</body>
</html>
